<!DOCTYPE html>
<html>

  <head>
    <title>Black-Owned & Found</title>

    <style>
      body {
        background-color: rgb(127, 65, 2);
        margin: 0;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: black;
        padding: 15px 40px;
      }

      nav h1 {
        color: yellow;
        margin: 0;
      }

      nav ul {
        color: yellow;
        align-items: center;
        list-style: none;
        display: flex;
        gap: 20px;
        margin: 0;
      }

      nav input {
        padding: 8px;
        width: 350px;
        border-radius: 5px;
        border: none;
      }

      nav a {
        color: yellow;
        text-decoration: none;
        font-family: Georgia, serif;
        font-weight: bold;
      }

      nav ul a {
        color: yellow;
      }

      nav a:hover {
        text-decoration: underline;
      }

      .login-container {
        text-align: center;
        margin-top: 100px;
        color: yellow;
      }

      .login-container input {
        padding: 10px;
        width: 250px;
        border-radius: 5px;
        border: none;
      }

      .login-container button {
        padding: 10px 20px;
        border: none;
        background-color: black;
        color: yellow;
        border-radius: 5px;
        cursor: pointer;
      }

      .login-container a {
        color: yellow;
        text-decoration: underline;
      }
      
    </style>
  </head>

  <body>

    <nav>
      <h1><a href="index.html">Black-Owned & Found</a></h1>

      <input type="text" placeholder="Search businesses">

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="businesses.html">Businesses</a></li>
        <li><a href="add-business.html">Add Business</a></li>
        <li id="authLink"></li>
      </ul>
    </nav>

    <div class="login-container">
      <h2>Login</h2>

      <form id="loginForm">
        <label for="name">Email:</label><br>
        <input type="email" id="email" required><br><br>

        <label for="category">Password:</label><br>
        <input type="password" id="password" required><br><br>

        <button type="submit">Login</button>
      </form>

      <p>
        Don't have an account?
        <a href="sign-up.html">Sign Up</a>
      </p>

      <p id="message"></p>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("user"));
      const authLink = document.getElementById("authLink");

      if (user) {
        authLink.innerHTML = `
          <span style="color: yellow;">Welcome, ${user.name || "User"}</span>
          <a href="#" onclick="logout()" style="margin-left: 10px;">Logout</a>
        `;
      } else {
        authLink.innerHTML = `<a href="login.html">Login</a>`;
      }

      function logout() {
        localStorage.removeItem("user");
        window.location.href = "login.html";
      }

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const response = await fetch("http://localhost:5001/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (response.ok) {
            localStorage.setItem("user", JSON.stringify(data.user));

            document.getElementById("message").textContent =
              `Login successful! Welcome, ${data.user.name || "User"}`;
          } else {
            document.getElementById("message").textContent =
              data.error || "Login failed";
          }

        } catch (err) {
          document.getElementById("message").textContent = "Error logging in.";
        }
      });
    </script>
  </body>
</html>
