<!DOCTYPE html>
<html>
<head>
  <title>Black-Owned & Found</title>

  <style>
    body {
      background-color: rgb(127, 65, 2);
      margin: 0;
      font-family: Arial, sans-serif;
    }

    nav {
      display: grid;
      grid-template-columns: 280px 1fr auto;
      align-items: center;
      background-color: black;
      padding: 15px 40px;
      gap: 30px;
    }

    nav h1 {
      color: yellow;
      margin: 0;
      white-space: normal;
    }


    nav ul {
      color: yellow;
      align-items: center;
      list-style: none;
      display: flex;
      gap: 30px;
      margin: 0;
      padding: 0;
      white-space: nowrap;
    }

    nav a {
      color: yellow;
      text-decoration: none;
      font-family: Georgia, serif;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      max-width: 1100px;
      margin: 40px auto;
      padding: 30px;
      background-color: black;
      border-radius: 10px;
      color: white;
      text-align: center;
    }

    .hero h3 {
      color: yellow;
      font-size: 36px;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
    }

    #results {
      max-width: 1100px;
      margin: 40px auto;
      padding: 30px;
      background-color: black;
      border-radius: 10px;
      color: white;

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .business-card {
      background-color: rgb(30, 30, 30);
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #444;
    }

    .business-card h3 {
      color: yellow;
      margin-top: 0;
    }

    .business-card p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .business-card a {
      color: yellow;
      font-weight: bold;
    }

    .search-area {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-self: start;
      margin-left: 0;
    }

    .search-area input,
    .search-area select {
      padding: 8px;
      border-radius: 5px;
      border: none;
    }

    .search-area input {
      width: 220px;
    }

    .search-area button {
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      background-color: yellow;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <nav>
    <h1><a href="index.html">Black-Owned & Found</a></h1>

    <div class="search-area">
      <input type="text" id="searchInput" placeholder="Search businesses">

      <select id="categoryFilter">
        <option value="">All Categories</option>
        <option value="Restaurant">Restaurant</option>
        <option value="Food Truck">Food Truck</option>
        <option value="Bakery & Desserts">Bakery & Desserts</option>
        <option value="Retail">Retail / Clothing</option>
        <option value="Beauty">Beauty (Hair, Nails, Barber)</option>
        <option value="Health">Health & Wellness</option>
        <option value="Fitness">Fitness / Gym</option>
        <option value="Technology">Technology</option>
        <option value="Professional Services">Professional Services</option>
        <option value="Automotive">Automotive</option>
        <option value="Education">Education / Tutoring</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Real Estate">Real Estate</option>
        <option value="Other">Other</option>
      </select>

      <button id="searchButton">Search</button>
    </div>

    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="businesses.html">Businesses</a></li>
      <li><a href="add-business.html">Add Business</a></li>
      <li id="authLink"></li>
    </ul>
  </nav>

  <section class="hero">
    <h3>Discover Black-Owned Businesses Near You</h3>
    <p>Support Black entrepreneurs in your community.</p>
  </section>

  <div id="results"></div>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    const authLink = document.getElementById("authLink");

    if (user) {
      authLink.innerHTML = `
        <span style="color: yellow;">Welcome, ${user.name || "User"}</span>
        <a href="#" onclick="logout()" style="margin-left: 10px;">Logout</a>
      `;
    } else {
      authLink.innerHTML = `<a href="login.html">Login</a>`;
    }

    function logout() {
      localStorage.removeItem("user");
      window.location.href = "login.html";
    }

    async function searchBusinesses() {
      const searchValue = document.getElementById("searchInput").value.trim();
      const categoryValue = document.getElementById("categoryFilter").value.trim();
      const resultsDiv = document.getElementById("results");

      resultsDiv.innerHTML = "";

      if (!searchValue && !categoryValue) {
        resultsDiv.innerHTML = "<p style='color: yellow; text-align: center;'>Please enter a search or select a category.</p>";
        return;
      }

      try {
        let url = `http://localhost:5001/businesses/search?`;

        if (searchValue) {
          url += `q=${encodeURIComponent(searchValue)}&`;
        }

        if (categoryValue) {
          url += `category=${encodeURIComponent(categoryValue)}`;
        }

        const response = await fetch(url);
        const businesses = await response.json();

        if (businesses.length === 0) {
          resultsDiv.innerHTML = "<p style='color: yellow; text-align: center;'>No businesses found.</p>";
          return;
        }

        businesses.forEach((business) => {
          const businessCard = document.createElement("div");
          businessCard.classList.add("business-card");

          businessCard.innerHTML = `
            <h3>${business.name}</h3>
            <p><strong>Category:</strong> ${business.category}</p>
            <p><strong>Location:</strong> ${business.city}, ${business.state}</p>
            <p><strong>Address:</strong> ${business.address || "No address listed"}</p>
            <p>${business.description || ""}</p>
            <p>
              ${business.website ? `<a href="${business.website}" target="_blank">Visit Website</a>` : ""}
            </p>
          `;

          resultsDiv.appendChild(businessCard);
        });

      } catch (error) {
        console.error("Frontend search error:", error);
        resultsDiv.innerHTML = "<p style='color: yellow; text-align: center;'>Error searching businesses.</p>";
      }
    }

    document.getElementById("searchButton").addEventListener("click", searchBusinesses);

    document.getElementById("searchInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        searchBusinesses();
      }
    });

    document.getElementById("categoryFilter").addEventListener("change", searchBusinesses);
  </script>

</body>
</html>
